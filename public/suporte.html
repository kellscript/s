<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suporte - Exemplo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --red:#ff0055;
  --red2:#ff3366;
  --glow:0 0 16px #ff005588,0 0 36px #ff336644;
  --wa:#25D366;
}

html,body{
  width:100%;height:100%;
  font-family:'Orbitron',sans-serif;
  background:#000;
  color:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;height:100%;
  z-index:0;
  pointer-events:none;
}

.chat-wrap{
  position:relative;
  z-index:1;
  width:min(95vw,400px);
  height:min(82vh,660px);
  background:rgba(4,0,10,.92);
  border-radius:20px;
  border:1px solid #ff005566;
  box-shadow:var(--glow),0 0 60px #ff005511;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chat-header{
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(90deg,#cc0033,#7a0020);
  padding:11px 14px;
  border-bottom:1px solid #ff005555;
  flex-shrink:0;
}

.avatar{
  width:34px;height:34px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.3);
  flex-shrink:0;
}

.header-info{flex:1;min-width:0;}

.header-name{
  font-size:.8rem;
  font-weight:700;
  letter-spacing:.06em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-status{
  font-size:.55rem;
  color:rgba(255,255,255,.55);
  letter-spacing:.05em;
  margin-top:2px;
}

.badge{
  width:20px;height:20px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 4px #0288d177);
}

.messages{
  flex:1;
  padding:14px 12px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:9px;
  scrollbar-width:thin;
  scrollbar-color:#ff005533 transparent;
}

.messages::-webkit-scrollbar{width:4px;}
.messages::-webkit-scrollbar-track{background:transparent;}
.messages::-webkit-scrollbar-thumb{background:#ff005544;border-radius:4px;}

.msg{
  padding:9px 13px;
  border-radius:14px;
  max-width:82%;
  font-size:.72rem;
  line-height:1.5;
  word-break:break-word;
  animation:fadeUp .25s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}

.msg.bot{
  background:rgba(255,0,85,.07);
  border:1px solid #ff005544;
  align-self:flex-start;
  border-bottom-left-radius:4px;
}

.msg.user{
  background:linear-gradient(135deg,#cc0033,var(--red));
  align-self:flex-end;
  border-bottom-right-radius:4px;
  box-shadow:0 0 10px #ff005544;
}

.typing-dots{
  display:inline-flex;
  gap:3px;
  align-items:center;
  height:14px;
}

.typing-dots span{
  width:5px;height:5px;
  border-radius:50%;
  background:#ff005599;
  animation:dot .9s infinite;
}

.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}

@keyframes dot{
  0%,80%,100%{transform:scale(.6);opacity:.4;}
  40%{transform:scale(1);opacity:1;}
}

.options{
  padding:10px;
  background:rgba(0,0,0,.6);
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  justify-content:center;
  border-top:1px solid #ff005533;
  flex-shrink:0;
}

.opt{
  background:rgba(255,0,85,.08);
  border:1px solid #ff005566;
  padding:7px 13px;
  border-radius:20px;
  color:#eee;
  font-family:'Orbitron',sans-serif;
  font-size:.62rem;
  letter-spacing:.04em;
  cursor:pointer;
  transition:background .2s,box-shadow .2s,transform .15s;
  -webkit-tap-highlight-color:transparent;
}

.opt:hover,.opt:active{
  background:var(--red);
  box-shadow:0 0 12px var(--red);
  transform:scale(1.05);
}

.opt:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none;
}

.wa-btn{
  position:absolute;
  bottom:78px;
  right:12px;
  width:44px;height:44px;
  background:var(--wa);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;
  box-shadow:0 4px 16px rgba(37,211,102,.4);
  transition:transform .2s,box-shadow .2s;
  z-index:2;
  flex-shrink:0;
}

.wa-btn:hover{
  transform:scale(1.12) rotate(6deg);
  box-shadow:0 6px 22px rgba(37,211,102,.6);
}

.wa-btn svg{width:24px;height:24px;fill:#fff;}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="chat-wrap">
  <div class="chat-header">
    <img class="avatar" src="https://files.catbox.moe/pk7r94.jpg" alt="Suporte">
    <div class="header-info">
      <div class="header-name">Suporte Exemplo</div>
      <div class="header-status">● Online agora</div>
    </div>
    <div class="badge"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#60D0FB"/><stop offset="100%" stop-color="#0E8FCD"/></linearGradient></defs><circle cx="10" cy="10" r="10" fill="url(#bg)"/><path d="M5.8 10.4l2.8 2.8 5.7-6.2" stroke="#fff" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <div class="messages" id="chat">
    <div class="msg bot">Olá! Mensagem explicativa de exemplo. Escolha uma opção abaixo:</div>
  </div>

  <div class="options" id="opts">
    <button class="opt" onclick="send('Como comprar?','Explicação de exemplo sobre compra.')">Como comprar?</button>
    <button class="opt" onclick="send('Pagamento','Explicação de exemplo sobre pagamento.')">Pagamento</button>
    <button class="opt" onclick="send('Instalação','Explicação de exemplo sobre instalação.')">Instalação</button>
    <button class="opt" onclick="send('Suporte','Explicação de exemplo sobre suporte.')">Suporte</button>
  </div>

  <a class="wa-btn" id="waBtn" href="https://wa.me/558892659041" target="_blank" rel="noopener" title="Falar no WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>
</div>

<script>
(function(){
  const c=document.getElementById('c');
  const ctx=c.getContext('2d');
  let W,H,stars,drops;
  const isMobile=innerWidth<600;

  function init(){
    W=c.width=innerWidth;H=c.height=innerHeight;
    const n=isMobile?50:100;
    stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,o:Math.random(),d:Math.random()*.008+.003}));
    const cols=isMobile?16:32;
    drops=Array.from({length:cols},(_,i)=>({x:(W/cols)*i,y:Math.random()*-H,s:Math.random()*7+8,sp:Math.random()*1.2+.7}));
  }

  let last=0;
  function draw(ts){
    if(ts-last<33){requestAnimationFrame(draw);return;}
    last=ts;
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.o+=s.d;if(s.o>1||s.o<0)s.d*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);
      ctx.fillStyle=`rgba(255,255,255,${s.o.toFixed(2)})`;ctx.fill();
    }
    for(const d of drops){
      ctx.font=`bold ${d.s}px monospace`;
      ctx.fillStyle='rgba(255,0,85,.14)';
      ctx.fillText(Math.random()>.5?'1':'0',d.x,d.y);
      d.y+=d.sp;if(d.y>H)d.y=Math.random()*-80;
    }
    requestAnimationFrame(draw);
  }
  init();requestAnimationFrame(draw);
  let ro;window.addEventListener('resize',()=>{clearTimeout(ro);ro=setTimeout(init,200);});

  const chat=document.getElementById('chat');
  const waBtn=document.getElementById('waBtn');
  let busy=false;
  let lastMsg='';

  window.send=function(q,a){
    if(busy)return;
    busy=true;
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);

    const uMsg=document.createElement('div');
    uMsg.className='msg user';uMsg.textContent=q;
    chat.appendChild(uMsg);scroll();

    const typing=document.createElement('div');
    typing.className='msg bot';
    typing.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
    chat.appendChild(typing);scroll();

    setTimeout(()=>{
      typing.remove();
      const bMsg=document.createElement('div');
      bMsg.className='msg bot';bMsg.textContent=a;
      chat.appendChild(bMsg);scroll();

      const waMsg=document.createElement('div');
      waMsg.className='msg bot';
      waMsg.innerHTML='Precisa de mais ajuda? <b style="color:var(--red)">Fale conosco no WhatsApp!</b>';
      chat.appendChild(waMsg);scroll();

      lastMsg=q+' — '+a;
      waBtn.href='https://wa.me/558892659041?text='+encodeURIComponent('Olá! Preciso de suporte.\n\nTópico: '+q+'\n\n'+a);

      setTimeout(()=>{
        busy=false;
        document.querySelectorAll('.opt').forEach(b=>b.disabled=false);
      },500);
    },1100);
  };

  function scroll(){chat.scrollTop=chat.scrollHeight;}
})();
</script>
</body>
</html>
